# ==============================================================================
# Ordexa Production Nginx Configuration
# Multi-Tenant Subdomain Routing, SSL Let's Encrypt & WebSockets (Reverb)
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=120r/m;

# Upstream Definitions
upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=10s;
}

upstream web_frontend {
    server web:3000 max_fails=3 fail_timeout=10s;
}

upstream reverb_websocket {
    server api:8080 max_fails=3 fail_timeout=10s;
}

# Redirect HTTP to HTTPS globally
server {
    listen 80;
    listen [::]:80;
    server_name ordexa.id *.ordexa.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API Gateway: api.ordexa.id
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ordexa.id;

    ssl_certificate /etc/letsencrypt/live/ordexa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordexa.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;

    # Payment Webhooks (Higher rate limit & signature verification)
    location /api/webhooks/ {
        limit_req zone=webhook_limit burst=30 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard API endpoints
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Laravel Reverb WebSockets: ws.ordexa.id
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.ordexa.id;

    ssl_certificate /etc/letsencrypt/live/ordexa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordexa.id/privkey.pem;

    location / {
        proxy_pass http://reverb_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Web Applications: ordexa.id, app.ordexa.id, order.ordexa.id
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ordexa.id app.ordexa.id order.ordexa.id;

    ssl_certificate /etc/letsencrypt/live/ordexa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordexa.id/privkey.pem;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
