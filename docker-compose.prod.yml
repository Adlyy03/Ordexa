services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ordexa}
      POSTGRES_USER: ${DB_USERNAME:-ordexa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ordexa_secret_2026}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ordexa} -d ${DB_DATABASE:-ordexa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ordexa-internal

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ordexa_redis_pass}"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ordexa_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ordexa-internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ordexa}
      DB_USERNAME: ${DB_USERNAME:-ordexa}
      DB_PASSWORD: ${DB_PASSWORD:-ordexa_secret_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ordexa_redis_pass}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ordexa-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.ordexa.id
    networks:
      - ordexa-internal

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
      - web
    networks:
      - ordexa-internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ordexa-internal

networks:
  ordexa-internal:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
  certbot_certs:
  certbot_www:
